# QLoRA fine-tuning of Llama 3.2 3B Instruct on the Q&A-to-story dataset.
# Run from the project root:
#   finetune/.venv/bin/python -m mlx_lm lora -c finetune/lora_config.yaml
#
# Sized for an Apple-silicon Mac with 8 GB RAM: 4-bit base weights, batch size 1,
# adapters on the attention projections of the top transformer blocks only.

model: mlx-community/Llama-3.2-3B-Instruct-4bit
data: finetune/data
adapter_path: finetune/adapters

train: true
fine_tune_type: lora
num_layers: 8            # top 8 of 28 transformer blocks
lora_parameters:
  rank: 16
  scale: 2.0             # equals lora_alpha / rank with lora_alpha = 32
  dropout: 0.05
  keys: ["self_attn.q_proj", "self_attn.k_proj", "self_attn.v_proj", "self_attn.o_proj"]

mask_prompt: true        # loss on the story text only, not on the prompt
batch_size: 1
grad_accumulation_steps: 2
iters: 600
learning_rate: 1.0e-4
max_seq_length: 1344
grad_checkpoint: true

steps_per_report: 20
steps_per_eval: 150
val_batches: 25
save_every: 150
seed: 7
