services:
  - type: web
    name: ai-story-generator
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/status
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.2
      - key: LLM_PROVIDER
        value: groq
      - key: OLLAMA_MODEL
        value: llama3-8b
      - key: GROQ_API_KEY
        sync: false
